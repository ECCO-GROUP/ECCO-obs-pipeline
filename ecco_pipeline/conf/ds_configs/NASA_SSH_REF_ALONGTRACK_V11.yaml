ds_name: NASA_SSH_REF_ALONGTRACK_V11 # Name for dataset
ecco_variable: ssh # ECCO variable grouping: sea_ice, sst, sss, ssh, mass
# start: "19800101T00:00:00Z" # yyyymmddThh:mm:ssZ
start: "20260701T00:00:00Z" # yyyymmddThh:mm:ssZ
end: "NOW" # yyyymmddThh:mm:ssZ for specific date or "NOW" for...now

# Provider specifications
harvester_type: cmr
cmr_concept_id: C4153607416-POCLOUD
filename_date_fmt: "%Y%m%d"
filename_date_regex: '\d{8}'
provider: "archive.podaac"

# Metadata
data_time_scale: "daily" # daily or monthly
fields:
  - name: ssha
    long_name: sea surface height anomaly
    standard_name: sea_surface_height_above_mean_sea_level
    units: m
    # ssha is NOT pre-masked by nasa_flag in the source; apply it here. (ssha_smoothed
    # already has the flag applied by the data producer, so it is not masked.)
    pre_transformations: ["NASA_SSH_mask_nasa_flag"]
    post_transformations: []
  - name: ssha_smoothed
    long_name: smoothed sea surface height anomaly
    standard_name: sea_surface_height_above_mean_sea_level
    units: m
    pre_transformations: []
    post_transformations: []
original_dataset_title: NASA-SSH Along Track Sea Surface Height from Standardized Reference Missions Only Version 1.1
original_dataset_short_name: NASA_SSH_REF_ALONGTRACK_V11
original_dataset_url: https://podaac.jpl.nasa.gov/dataset/NASA_SSH_REF_ALONGTRACK_V11
original_dataset_reference: "https://archive.podaac.earthdata.nasa.gov/podaac-ops-cumulus-docs/web-misc/nasa-ssh/NASA-SSH_V1_1_UserGuide.pdf"
original_dataset_doi: 10.5067/NSREF-AT0V11

# Transformation
t_version: 1.0 # Update this value if any changes are made to this file
time_bounds_var: ""
transpose: False

# Along-track source geometry: 1-D per-sample lat/lon observations binned to the
# nearest target grid cell (ADR 0002), not a regular source grid.
source_type: along_track
lat_var: latitude
lon_var: longitude
allow_nearest_neighbor: false # keep output honestly sparse; nearest-cell binning never fills empties
mapping_operation: nanmean # source ~31% NaN in ssha

data_res: 1/2 # REQUIRED by schema; nominal for along_track (unused — binning uses the
              # grid's per-cell radius, not data_res). area_extent / dims / proj_info are
              # not needed to build the source grid for along_track.

notes: "" # String to include in global attributes of output files

# Aggregation
a_version: 1.0 # Update this value if any changes are made to this file
remove_nan_days_from_data: True # Remove empty days from data when aggregating
do_monthly_aggregation: True
skipna_in_mean: False # Controls skipna when calculating monthly mean
